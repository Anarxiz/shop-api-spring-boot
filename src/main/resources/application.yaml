spring:
  application:
    name: shop
  datasource:
    url: jdbc:postgresql://localhost:5432/dbtest
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate   # схему создаёт Flyway, Hibernate только проверяет
    open-in-view: false
    properties:
      hibernate:
        default_schema: shop
  flyway:
    schemas: shop
    create-schemas: true

# Настройки приложения
app:
  rate-limit:
    enabled: true
    auth-requests-per-minute: 5
  jwt:
    secret-key: ${JWT_SECRET_KEY:SUPER_SECRET_KEY_CHANGE_ME_AT_LEAST_32_BYTES}
    issuer: AppApi
    audience: AppClient
    expiry-in-minutes: 180

logging:
  level:
    root: INFO

# Служебный HTTP-сервер: локально доступен только с этой машины.
# В Docker адрес переопределяется, порт не публикуется на хост.
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s

